name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov=dead_bracket \
            --cov-report=term-missing \
            --cov-fail-under=85
      - name: Enforce >=90% on strategy/risk/execution
        run: |
          python -m pytest \
            --cov=dead_bracket.strategy \
            --cov=dead_bracket.risk \
            --cov=dead_bracket.executor \
            --cov-report=term-missing \
            --cov-fail-under=90
